services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burst}
      POSTGRES_USER: ${POSTGRES_USER:-burst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burst123}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    # 数据库不发布到宿主端口，仅在 compose 内部网络访问

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-burst}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-burst}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-burst123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      # 仅应用服务发布到宿主端口（宿主端口由 CC_PUBLISH_PORT 指定）
      - "${CC_PUBLISH_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  dbdata:

networks:
  internal:
