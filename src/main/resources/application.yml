server:
  port: 8080

spring:
  application:
    name: burst-repair-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/burst}
    username: ${SPRING_DATASOURCE_USERNAME:burst}
    password: ${SPRING_DATASOURCE_PASSWORD:burst123}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # 演示数据初始化开关（生产可关闭）
  seed-demo-data: ${SEED_DEMO_DATA:true}
