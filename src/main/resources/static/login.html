<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 城市供水爆管抢修指挥平台</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-logo">💧</div>
    <h1>城市供水爆管抢修指挥平台</h1>
    <p class="login-sub">爆管报警 · 影响评估 · 调度派单 · 抢修复供 · 客服通知</p>
    <form method="post" action="/login">
        <label>用户名
            <input type="text" name="username" required autofocus placeholder="如 dispatcher">
        </label>
        <label>密码
            <input type="password" name="password" required placeholder="如 disp123">
        </label>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div id="err" class="login-err" style="display:none">用户名或密码错误，请重试</div>
    <div class="login-demo">
        <b>演示账号</b>（角色 / 用户名 / 密码）<br>
        调度员 dispatcher / disp123 ｜ 抢修队 crew / crew123<br>
        客服 cs / cs123 ｜ 水质检测 quality / qua123 ｜ 管理员 admin / admin123
    </div>
</div>
<script>
    if (location.search.includes('error')) document.getElementById('err').style.display = 'block';
</script>
</body>
</html>
